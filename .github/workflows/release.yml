name: Release

# Publishes a GitHub release, tagged vX.Y.Z, each time a pull request merges
# into dev. Direct pushes to dev don't release. .github/scripts/release_version.py
# picks the version from the commits since the last tag: a feat: commit bumps
# minor, anything else bumps patch, and the first release is pyproject.toml's
# version (0.1.0). Major happens only when the merged pull request has the
# release:major label. The tag is the version of record; nothing is committed
# back to the branch. To retry a failed release, re-run the failed workflow run.
on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Merged (not just closed) pull requests from this repository only.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    permissions:
      contents: write # tags and releases
    env:
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Re-run the checks on the exact commit being released.
      - name: Run the tests
        run: |
          uv sync --locked
          uv run pytest

      - name: Work out the version
        id: version
        shell: bash
        env:
          MAJOR: ${{ contains(github.event.pull_request.labels.*.name, 'release:major') }}
        run: |
          set -euo pipefail
          args=(next)
          if [ "$MAJOR" = true ]; then
            echo "The pull request has release:major; bumping the major version."
            args+=(--major)
          fi
          version=$(uv run --no-project python .github/scripts/release_version.py "${args[@]}")
          if [ -z "$version" ]; then
            echo "This commit is already released; nothing to do."
          elif [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Next version: $version"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Expected an X.Y.Z version, got: $version"
            exit 1
          fi

      - name: Publish the release
        if: steps.version.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released."
            exit 0
          fi
          uv run --no-project python .github/scripts/release_version.py notes "$TAG" --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --target "$MERGE_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          echo "Published $TAG."
