name: Release

# Publishes a GitHub release, tagged vX.Y.Z, each time a change reaches main.
# .github/scripts/release_version.py picks the version from the commits since
# the last tag: a feat: commit bumps minor, anything else bumps patch. Major
# happens only when the dev-to-main pull request has the release:major label.
# The tag is the version of record; nothing is committed back to main.
on:
  push:
    branches: [main]
  # To publish again after a failed run. Only main publishes.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write # tags and releases
      pull-requests: read # the release:major label
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10

      # Re-run the checks on the exact commit being released.
      - name: Run the tests
        run: |
          uv sync --locked
          uv run pytest

      - name: Check for the release:major label
        id: label
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.base.ref == "main") | .labels[].name] | join(",")')
          if [[ ",$labels," == *",release:major,"* ]]; then
            echo "The pull request has release:major; bumping the major version."
            echo "major=true" >> "$GITHUB_OUTPUT"
          else
            echo "major=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Work out the version
        id: version
        shell: bash
        env:
          MAJOR: ${{ steps.label.outputs.major }}
        run: |
          set -euo pipefail
          args=(next)
          if [ "$MAJOR" = true ]; then args+=(--major); fi
          version=$(uv run --no-project python .github/scripts/release_version.py "${args[@]}")
          if [ -z "$version" ]; then
            echo "This commit is already released; nothing to do."
          elif [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Next version: $version"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Expected an X.Y.Z version, got: $version"
            exit 1
          fi

      - name: Publish the release
        if: steps.version.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released."
            exit 0
          fi
          uv run --no-project python .github/scripts/release_version.py notes "$TAG" --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          echo "Published $TAG."
