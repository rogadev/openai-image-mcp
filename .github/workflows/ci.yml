name: CI

# Runs on every pull request into main and every push to dev. The "test" job
# is the check branch protection requires before a dev-to-main merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-branch:
    name: source branch
    runs-on: ubuntu-latest
    steps:
      - name: Only dev merges into main
        env:
          EVENT: ${{ github.event_name }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "Not a pull request; nothing to check."
            exit 0
          fi
          if [ "$HEAD_REPO" != "$REPO" ] || [ "$HEAD" != dev ]; then
            echo "::error::Pull requests into main must come from this repository's dev branch (this one is from $HEAD_REPO:$HEAD)."
            exit 1
          fi
          echo "Pull request is from dev."

  test:
    name: test
    # The server targets Windows (Credential Manager, Claude Desktop), so test there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run the tests
        run: uv run pytest
