[project]
name = "openai-image-mcp"
version = "0.1.0"
description = "Local MCP server that lets Claude Code and Claude Desktop generate images with OpenAI's Image API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.7.0",
    "mcp>=2.3.0",
    "openai>=3.51.0",
    "pillow>=13.0.0",
]

[project.scripts]
openai-image-mcp = "openai_image_mcp.server:main"

[build-system]
requires = ["uv_build>=0.8.18,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
